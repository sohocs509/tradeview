services:
  tradeview-api:
    build:
      context: ../../backend/api
      dockerfile: Dockerfile
    image: tradeview-api:latest
    container_name: tradeview-api
    ports:
      - "8770:8770"
    environment:
      - TV_API_PORT=8770
      - TV_VALKEY_HOST=tradeview-valkey
      - TV_VALKEY_PORT=6379
    depends_on:
      - tradeview-valkey
    restart: unless-stopped
    networks:
      - tradeview-net

  tradeview-valkey:
    image: valkey/valkey:8-alpine
    container_name: tradeview-valkey
    ports:
      - "6380:6379"
    volumes:
      - tradeview-valkey-data:/data
    restart: unless-stopped
    networks:
      - tradeview-net

  tradeview-ml-fallback:
    build:
      context: ../../backend/ml
      dockerfile: Dockerfile
    image: tradeview-ml:latest
    container_name: tradeview-ml-fallback
    ports:
      - "8767:8766"
    environment:
      - TV_ML_PORT=8766
      - TV_DB_HOST=${TV_DB_HOST:-otto.local}
      - TV_DB_PORT=${TV_DB_PORT:-5433}
      - TV_DB_USER=${TV_DB_USER:-tradeview}
      - TV_DB_PASSWORD=${TV_DB_PASSWORD}
      - TV_DB_NAME=tradeview
    volumes:
      - tradeview-models-fallback:/data/models
    restart: unless-stopped
    networks:
      - tradeview-net
    profiles:
      - fallback

volumes:
  tradeview-valkey-data:
  tradeview-models-fallback:

networks:
  tradeview-net:
    name: tradeview-net

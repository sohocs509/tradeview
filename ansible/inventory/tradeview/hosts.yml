all:
  children:
    tradeview_api:
      hosts:
        milo.local:
          ansible_user: pi
          tradeview_api_port: 8770
          tradeview_valkey_port: 6380
          tradeview_compose_file: docker/milo/compose.yml

    tradeview_data:
      hosts:
        otto.local:
          ansible_user: pi
          tradeview_tsdb_port: 5433
          tradeview_compose_file: docker/otto/compose.yml

    tradeview_ml:
      hosts:
        pete.local:
          ansible_user: pi
          tradeview_ml_port: 8766
          tradeview_compose_file: docker/pete/compose.yml
          # pete uses Podman — compose_cmd overridden below
          compose_cmd: podman compose

    tradeview_client:
      hosts:
        fw01.local:
          ansible_user: david
          godot_version: "4.3"
          godot_install_dir: /opt/godot
          tradeview_godot_project: /home/david/projects/tradeview/godot_project

  vars:
    ansible_user: pi
    tradeview_project_root: /home/pi/projects/tradeview
    tradeview_git_repo: git@github.com:sohocs509/tradeview.git
    tradeview_git_branch: main
    compose_cmd: docker compose
    tradeview_valkey_host: milo.local
    tradeview_api_host: milo.local
    tradeview_ml_host: pete.local
    tradeview_tsdb_host: otto.local
